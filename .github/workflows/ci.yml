name: ROS 2 Jazzy CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: jazzy
      - name: Install workspace dependencies
        run: |
          source /opt/ros/jazzy/setup.bash
          rosdep update
          rosdep install --from-paths src --ignore-src --rosdistro jazzy -r -y
      - name: Build
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon build --cmake-args -DCMAKE_EXPORT_COMPILE_COMMANDS=ON --event-handlers console_direct+
      - name: Static analysis
        run: bash tools/run_clang_tidy.sh --log clang-tidy.log
      - name: Test with 8 workers
        run: |
          source install/setup.bash
          # High-contention failures have exposed real races, so CI uses the
          # same eight-worker default documented for local full-suite runs.
          colcon test --executor parallel --parallel-workers 8 --event-handlers console_direct+
          colcon test-result --verbose
      - name: Upload failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: colcon-test-logs
          path: |
            log/
            clang-tidy.log
            build/**/Testing/Temporary/
          if-no-files-found: ignore
