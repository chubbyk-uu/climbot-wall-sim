line_tracker:
  ros__parameters:
    cruise_speed: 0.20
    cross_gain: 1.0
    cross_integral_gain: 0.30
    cross_integral_limit_m_s: 0.10
    heading_gain: 2.0
    control_frequency_hz: 50.0
    odometry_timeout_s: 0.25
    standalone_mode: true
    segment_timeout_s: 120.0
    motion_region_tolerance_m: 0.02
    turn_slip_per_degree_m: 0.00041
    parallel_scan_offset_m: 0.045
    maximum_scan_offset_m: 0.12
    # Bounds where a scan line entered by arc is frozen, so it has to sit
    # inside the 20 mm adjacent-spacing budget of PROJECT_GUIDE 14.3.
    arc_entry_finish_offset_m: 0.012
    arc_entry_speed_mps: 0.08
    arc_entry_lookahead_m: 0.20
    arc_entry_heading_gain: 2.0
    arc_entry_max_heading_deg: 20.0
    arc_entry_max_angular_speed: 0.25
    arc_entry_timeout_s: 15.0
    # This is a diagnostic for visibly large oscillations, not a zero-crossing fault.
    visible_oscillation_amplitude_m: 0.03
    visible_oscillation_minimum_travel_m: 0.10
    visible_oscillation_reversals: 4
    max_linear_speed: 0.25
    max_angular_speed: 0.35
    max_heading_correction_deg: 12.0
    max_gravity_feedforward_deg: 8.0
    max_cross_feedback_deg: 8.0
    alignment_threshold_deg: 10.0
    cross_slowdown_start_m: 0.03
    cross_slowdown_full_m: 0.08
    cross_slowdown_min_scale: 0.25
    alignment_reentry_threshold_deg: 12.0
    # A deadband, not a convergence target: inside it ALIGN_SETTLE commands
    # zero angular velocity and stops correcting, so whatever error the robot
    # carried across the edge is what it starts the scan line with. It has to
    # stay well under the 2.0 deg maximum_turn_end_heading_error_deg that
    # PROJECT_GUIDE 14.3 accepts - at 2.0 the two were the same number and the
    # residual sat at 1.5 to 1.8 deg with no margin at all. 0.5 measured clean
    # too (107 settles, never more than one command reversal in any of them),
    # but 1.0 keeps a 2x margin without asking a real robot's heading estimate
    # to hold a deadband that narrow.
    alignment_tolerance_deg: 1.0
    alignment_settle_duration_s: 0.50
    turn_heading_gain: 2.0
    max_turn_angular_speed: 0.60
    max_turn_angular_acceleration: 1.00
    # A terminal guard, not the mechanism that stops the robot: the braking
    # profile below already lands within a few millimetres. Kept just above
    # goal_position_exit_tolerance_m, and at a speed the profile is close to
    # anyway at that distance, so the guard costs about 0.2 s per segment.
    final_approach_distance_m: 0.05
    final_approach_speed_mps: 0.08
    goal_position_tolerance_m: 0.03
    goal_position_exit_tolerance_m: 0.04
    # This covers the entry leg's end, where the robot turns in place and
    # slips while stopped; tightening it there stalls the approach. Stopping
    # accuracy comes from the braking profile instead.
    start_approach_tolerance_m: 0.05
    start_approach_exit_tolerance_m: 0.06
    goal_heading_exit_tolerance_deg: 3.0
    stopped_linear_speed_mps: 0.01
    stopped_angular_speed_rps: 0.02
    goal_settle_duration_s: 0.30
    max_linear_acceleration: 0.20
    max_linear_deceleration: 0.25
    # Deliberately below max_linear_deceleration: the distance-to-stop profile
    # has to ask for less than the rate limiter can deliver, or the command
    # trails the profile all the way down and passes the endpoint. Braking
    # starts at cruise_speed^2 / (2 * 0.12) = 0.167 m.
    braking_profile_deceleration: 0.12
    max_angular_acceleration: 0.80
    gravity_slip_ratio: 0.1042
    gravity_down_x: 0.0
    gravity_down_y: -1.0

cmd_vel_watchdog:
  ros__parameters:
    command_timeout_s: 0.40
    publish_rate_hz: 50.0
