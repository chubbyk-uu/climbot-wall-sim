coverage_planner:
  ros__parameters:
    frame_id: odom
    task_id: trapezoid-horizontal-large
    input_mode: parameters
    region_type: trapezoid
    # Isosceles trapezoid: 4.0 m bottom, 2.6 m top, 2.8 m height.
    lower_left: [-3.0, 1.2]
    upper_right: [1.5, 3.6]
    lower_right: [3.0, 1.2]
    detection_width: 0.50
    detection_length: 0.01
    overlap_ratio: 0.20
    sweep_direction: horizontal
    start_corner: lower_left
    path_height: 0.06
    bottom_warning_tolerance: 0.05
