coverage_planner:
  ros__parameters:
    frame_id: odom
    task_id: trapezoid-horizontal-large
    input_mode: parameters
    region_type: trapezoid
    # Isosceles trapezoid: 6.50 m bottom, 3.25 m top, 3.30 m height.
    lower_left: [0.75, 1.35]
    upper_right: [5.625, 4.65]
    lower_right: [7.25, 1.35]
    detection_width: 0.50
    detection_length: 0.01
    overlap_ratio: 0.20
    sweep_direction: horizontal
    start_corner: lower_left
    path_height: 0.06
    bottom_warning_tolerance: 0.05
