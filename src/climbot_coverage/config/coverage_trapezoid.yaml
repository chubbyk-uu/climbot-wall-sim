coverage_planner:
  ros__parameters:
    frame_id: odom
    task_id: trapezoid
    input_mode: parameters
    region_type: trapezoid
    lower_left: [-3.0, 0.50]
    # Top width is 3.0 m versus the 6.0 m bottom, producing clear diagonal
    # transitions for controller validation.
    upper_right: [1.5, 6.5]
    lower_right: [3.0, 0.54]
    detection_width: 0.50
    # Conservative provisional value; replace with the calibrated payload length.
    detection_length: 0.01
    overlap_ratio: 0.20
    sweep_direction: horizontal
    start_corner: lower_left
    path_height: 0.06
    bottom_warning_tolerance: 0.05
