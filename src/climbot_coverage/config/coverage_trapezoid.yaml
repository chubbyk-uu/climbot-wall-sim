coverage_planner:
  ros__parameters:
    frame_id: odom
    task_id: trapezoid
    input_mode: parameters
    region_type: trapezoid
    lower_left: [0.75, 0.75]
    # Top width is 3.25 m versus the 6.50 m bottom, producing clear diagonal
    # transitions for controller validation.  The 40 mm rise from the left
    # bottom corner to the right one keeps that edge off horizontal.
    upper_right: [5.625, 5.25]
    lower_right: [7.25, 0.79]
    detection_width: 0.50
    # Conservative provisional value; replace with the calibrated payload length.
    detection_length: 0.01
    overlap_ratio: 0.20
    sweep_direction: horizontal
    start_corner: lower_left
    path_height: 0.06
    bottom_warning_tolerance: 0.05
