coverage_planner:
  ros__parameters:
    frame_id: odom
    task_id: rectangle
    input_mode: parameters
    region_type: rectangle
    lower_left: [0.75, 0.75]
    upper_right: [7.25, 5.25]
    lower_right: [7.25, 0.75]
    detection_width: 0.50
    # Conservative provisional value; replace with the calibrated payload length.
    detection_length: 0.01
    overlap_ratio: 0.20
    sweep_direction: horizontal
    start_corner: lower_left
    path_height: 0.06
    bottom_warning_tolerance: 0.05
