coverage_planner:
  ros__parameters:
    frame_id: odom
    task_id: horizontal-rectangle-demo
    input_mode: parameters
    region_type: rectangle
    # Horizontal demo: 3.40 m wide by 1.70 m high.  The first scan centreline
    # and its extended start point coincide with the spawn pose at (4.0, 2.0):
    # 1.75 + detection_width/2 = 2.0 up, 4.005 - detection_length/2 = 4.0 across.
    lower_left: [4.005, 1.75]
    upper_right: [7.405, 3.45]
    lower_right: [7.405, 1.75]
    detection_width: 0.50
    detection_length: 0.01
    overlap_ratio: 0.20
    sweep_direction: horizontal
    start_corner: lower_left
    path_height: 0.06
    bottom_warning_tolerance: 0.05
