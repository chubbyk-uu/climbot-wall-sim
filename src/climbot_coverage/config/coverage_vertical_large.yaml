coverage_planner:
  ros__parameters:
    frame_id: odom
    task_id: vertical-rectangle-large
    input_mode: parameters
    region_type: rectangle
    # Large vertical block: 5.00 m wide by 4.50 m high, filling the reachable
    # height of the wall.
    lower_left: [1.5, 0.75]
    upper_right: [6.5, 5.25]
    lower_right: [6.5, 0.75]
    detection_width: 0.50
    detection_length: 0.01
    overlap_ratio: 0.20
    sweep_direction: vertical
    start_corner: lower_left
    path_height: 0.06
    bottom_warning_tolerance: 0.05
