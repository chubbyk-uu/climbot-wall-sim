coverage_planner:
  ros__parameters:
    frame_id: odom
    task_id: vertical-rectangle-large
    input_mode: parameters
    region_type: rectangle
    # Large vertical rectangle: 4.00 m wide by 4.80 m high.  Unlike the demo
    # of the same shape, nothing here is tied to the spawn pose.
    lower_left: [3.0, 1.2]
    upper_right: [7.0, 6.0]
    lower_right: [7.0, 1.2]
    detection_width: 0.50
    detection_length: 0.01
    overlap_ratio: 0.20
    sweep_direction: vertical
    start_corner: lower_left
    path_height: 0.06
    bottom_warning_tolerance: 0.05
