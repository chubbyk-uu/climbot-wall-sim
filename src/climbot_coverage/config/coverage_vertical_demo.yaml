coverage_planner:
  ros__parameters:
    frame_id: odom
    task_id: vertical-rectangle-demo
    input_mode: parameters
    region_type: rectangle
    # With a 0.50 m footprint the first vertical centreline starts at the spawn
    # x of 4.0, and the 0.01 m longitudinal extension places its first waypoint
    # at the spawn y of 2.0.
    lower_left: [3.75, 2.005]
    # Vertical demo: 3.30 m wide by 3.40 m high.
    upper_right: [7.05, 5.405]
    lower_right: [7.05, 2.005]
    detection_width: 0.50
    detection_length: 0.01
    overlap_ratio: 0.20
    sweep_direction: vertical
    start_corner: lower_left
    path_height: 0.06
    bottom_warning_tolerance: 0.05
