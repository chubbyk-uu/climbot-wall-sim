# Planner settings for the RViz click-selection workflow, which is what
# coverage_mission.launch.py runs by default.
#
# The shape and the sweep direction are chosen in the Coverage Task panel while
# the planner runs, so nothing here may claim either of them as part of the
# task's identity. coverage_rectangle.yaml used to fill this role and its
# task_id said "rectangle", which the panel could then contradict on screen:
# a trapezoid drawn under the words "Executing rectangle".
coverage_planner:
  ros__parameters:
    frame_id: odom
    # Names where the region came from, not what shape it turned out to be.
    task_id: rviz-selection
    input_mode: rviz
    # Starting position of the two panel boxes, not a commitment.
    region_type: rectangle
    sweep_direction: horizontal
    start_corner: lower_left
    # Ignored while input_mode is rviz, and kept valid anyway: input_mode is
    # also a launch argument, so this file can be run in parameters mode by
    # someone who did not open it first.
    lower_left: [2.0, 0.5]
    upper_right: [8.0, 6.5]
    lower_right: [8.0, 0.5]
    detection_width: 0.50
    detection_length: 0.28125
    # The inspection camera optical centre is 0.340 m ahead of base_link.
    detection_forward_offset: 0.340
    # Compatibility field: camera geometry is displayed after route planning,
    # never fed back into the permitted base_link route.
    detection_edge_overlap: 0.0
    # Lateral scan-band overlap. Independent from longitudinal image triggering.
    overlap_ratio: 0.20
    # Default missions report camera coverage but do not add a special return
    # scan. A contract requiring top-edge completion can opt into auto/always.
    top_edge_scan: never
    path_height: 0.06
    bottom_warning_tolerance: 0.05
