coverage_planner:
  ros__parameters:
    frame_id: odom
    task_id: trapezoid-vertical-demo
    input_mode: parameters
    region_type: trapezoid
    # Same short-top trapezoid, swept vertically to exercise sloped transitions.
    lower_left: [-0.6, 1.4]
    upper_right: [2.7, 4.2]
    lower_right: [3.4, 1.4]
    detection_width: 0.50
    detection_length: 0.01
    overlap_ratio: 0.20
    sweep_direction: vertical
    start_corner: lower_left
    path_height: 0.06
    bottom_warning_tolerance: 0.05
