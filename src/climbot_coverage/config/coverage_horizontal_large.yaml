coverage_planner:
  ros__parameters:
    frame_id: odom
    task_id: horizontal-rectangle-large
    input_mode: parameters
    region_type: rectangle
    # Large horizontal band: 6.50 m wide by 3.30 m high, filling the reachable
    # width of the wall.
    lower_left: [0.75, 1.35]
    upper_right: [7.25, 4.65]
    lower_right: [7.25, 1.35]
    detection_width: 0.50
    detection_length: 0.01
    overlap_ratio: 0.20
    sweep_direction: horizontal
    start_corner: lower_left
    path_height: 0.06
    bottom_warning_tolerance: 0.05
