coverage_planner:
  ros__parameters:
    frame_id: odom
    task_id: horizontal-rectangle-large
    input_mode: parameters
    region_type: rectangle
    # Large horizontal rectangle: 6.00 m wide by 2.40 m high.  Unlike the demo
    # of the same shape, nothing here is tied to the spawn pose.
    lower_left: [2.0, 1.2]
    upper_right: [8.0, 3.6]
    lower_right: [8.0, 1.2]
    detection_width: 0.50
    detection_length: 0.01
    overlap_ratio: 0.20
    sweep_direction: horizontal
    start_corner: lower_left
    path_height: 0.06
    bottom_warning_tolerance: 0.05
