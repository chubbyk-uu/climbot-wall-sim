# High-resolution offline-processing dataset: vertical scan headings alternate
# up/down.  It must be acquired with textures/wall_025/wall_texture.json.
# The 4.1 x 6.0 m drive region keeps the same ten-line, roughly 270-frame
# scale as the horizontal set while exercising a different heading pattern.
coverage_planner:
  ros__parameters:
    frame_id: odom
    task_id: inspection-dataset-vertical-camera-zfix-025mm-20260826
    input_mode: parameters
    region_type: rectangle
    lower_left: [3.0, 1.0]
    upper_right: [7.1, 7.0]
    lower_right: [7.1, 1.0]
    detection_width: 0.50
    detection_length: 0.28125
    detection_forward_offset: 0.340
    detection_edge_overlap: 0.0
    overlap_ratio: 0.20
    sweep_direction: vertical
    start_corner: lower_left
    path_height: 0.06
    bottom_warning_tolerance: 0.05
