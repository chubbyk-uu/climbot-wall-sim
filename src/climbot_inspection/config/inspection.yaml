capture_once_node:
  ros__parameters:
    source_image_topic: /simulation/inspection_camera/image_raw
    source_camera_info_topic: /simulation/inspection_camera/camera_info
    trigger_topic: /simulation/inspection_camera/trigger
    output_image_topic: /inspection/camera/image_raw
    output_camera_info_topic: /inspection/camera/camera_info
    capture_service: /inspection/capture_once
    capture_reset_service: /inspection/capture_reset
    capture_state_topic: /inspection/capture_state
    expected_frame_id: inspection_camera_optical_frame
    expected_width: 1920
    expected_height: 1080
    capture_timeout_s: 5.0
    discovery_settle_s: 0.5
    warmup_retry_s: 1.0
    warmup_quiet_s: 0.25
    # Reject frames timestamped before the trigger. This assumes source clocks
    # are synchronized, as they are in the Gazebo transport.
    enforce_trigger_stamp: true

automatic_capture_node:
  ros__parameters:
    execution_reference_topic: /control/execution_reference
    odometry_topic: /odometry/filtered
    image_topic: /inspection/camera/image_raw
    capture_service: /inspection/capture_once
    metadata_topic: /inspection/capture_metadata
    capture_gate_topic: /inspection/capture_gate
    # Longitudinal photo-trigger policy. It is intentionally independent from
    # the planner's lateral overlap_ratio; both defaults are 20% for G2.
    image_overlap_ratio: 0.20
    reference_timeout_s: 0.5
    # Service success is not evidence that its image arrived. Retry the same
    # spatial target if the image transport/QoS path is broken or drops a frame.
    image_wait_timeout_s: 1.0
    pose_wait_timeout_s: 0.5
    pose_cache_duration_s: 3.0

archive_recorder_node:
  ros__parameters:
    image_topic: /inspection/camera/image_raw
    camera_info_topic: /inspection/camera/camera_info
    metadata_topic: /inspection/capture_metadata
    status_topic: /inspection/archive/status
    expected_frame_id: inspection_camera_optical_frame
    expected_width: 1920
    expected_height: 1080
    # This is a reserve in addition to the conservative per-task estimate.
    # The root is injected by launch. A bare node derives $HOME/climbot_data.
    minimum_free_bytes: 536870912
    # Keep image/label writes atomic, then make this many images durable in one
    # filesystem commit. Completion, cancellation and failure force a final
    # commit, so a successful archive always has zero staged images.
    durable_commit_batch_images: 32
    pair_timeout_s: 2.0
    image_overlap_ratio: 0.20
    # Runtime guard for the actual, labelled camera positions. The nominal
    # longitudinal spacing is length * (1 - image_overlap_ratio).
    actual_spacing_tolerance_m: 0.010
    maximum_target_lag_m: 0.025
