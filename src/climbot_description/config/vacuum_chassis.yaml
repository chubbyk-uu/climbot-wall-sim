# Shared geometry/mass inputs for the accepted default vacuum chassis.
# All material/mass/contact choices below are provisional simulation proxies.
vacuum_chassis:
  schema_version: 1
  body:
    length_m: 0.4265                 # CAD dimension
    width_m: 0.342                   # CAD dimension
    centre_x_m: -0.141               # CAD pixel measurement, +/- 0.005 m
    bottom_z_m: 0.018                # CAD dimension
    top_z_m: 0.103                   # CAD dimension
    floor_thickness_m: 0.003
    floor_density_kg_m3: 2700.0      # equivalent aluminium plate, assumption
    cover_thickness_m: 0.0025
    cover_density_kg_m3: 1050.0      # equivalent polymer cover, assumption
    # Two side bays leave a continuous centre channel for the three fan ducts.
    internal_mass_kg: 8.0            # motors, battery, electronics, fasteners
    internal_bay_size_xyz_m: [0.28, 0.07, 0.05]
    internal_bay_y_m: 0.105
    internal_bay_z_m: 0.055
  wheel:
    radius_m: 0.0475                 # midpoint of CAD 45--50 mm estimate
    separation_m: 0.435              # CAD pixel measurement
    outer_width_m: 0.482             # CAD dimension; derives wheel width
    mass_each_kg: 0.6                # rotating wheel, excludes drive motor
    joint_damping_nm_s: 0.05         # accepted actuator damping
  caster:
    # Rear-relative mount follows the same body CAD-offset uncertainty.
    rear_offset_m: 0.05425            # revised candidate ball x=-0.300 m
    mount_tolerance_m: 0.002
    radius_m: 0.0125
    ball_density_kg_m3: 7850.0
    housing_mass_kg: 0.2              # includes cup, rollers and flange
    housing_width_m: 0.036
    housing_bore_m: 0.028
    housing_bottom_z_m: 0.015
    housing_top_z_m: 0.045
    cap_thickness_m: 0.003
    flange_width_m: 0.050
    floor_cutout_m: 0.042
    clearance_to_seal_m: 0.010
  fans:
    count: 3
    # Offsets from body centre, not a claim about measured hardware locations.
    x_offsets_m: [0.116, 0.016, -0.084]
    radius_m: 0.04
    height_m: 0.04
    centre_z_m: 0.073
    mass_each_kg: 0.45
    port_width_m: 0.05
    duct_wall_m: 0.0025
  skirt:
    contact_band_m: 0.020
    free_height_m: 0.022
    mass_kg: 0.35
    stiffness_n_m: 5000.0
    lip_pressure_weight: 0.5
    sliding_mu: 0.10
    velocity_regularization_mps: 0.001
    samples_per_side: 32
  bracket:
    # Provisional aluminium thin-wall proxy for the accepted curved main arm,
    # twin round carry tubes and sloping rear support; not measured hardware.
    # Rounded main/rear sections use bounding rectangular hollow sections.
    density_kg_m3: 2700.0
    width_y_m: 0.040
    thickness_m: 0.020
    wall_m: 0.002
    attachment_front_inset_m: 0.0225
    handle_spacing_m: 0.080
    handle_radius_m: 0.011
    handle_wall_m: 0.0015
    grip_density_kg_m3: 1100.0
  analysis:
    margin: 1.5
    drive_floor_n: 5.0
    caster_floor_n: 10.0
    caster_rolling_coefficient: 0.01
    caster_rolling_regularization_mps: 0.001
    pressure_rounding_pa: 100.0
    maximum_search_pressure_pa: 30000.0
    # Geometric variants change the outline and all derived mass/areas together.
    front_extensions_m: [0.0, 0.020, 0.040]
    caster_reference_x_m: [-0.240, -0.280, -0.290, -0.295, -0.300, -0.310]
    internal_mass_scan_kg: [6.0, 8.0, 10.0]
    drive_mu_scan: [0.8, 1.1, 1.3]
    body_offset_scan_m: [-0.005, 0.0, 0.005]
    skirt_band_scan_m: [0.015, 0.020, 0.025]
    lip_weight_scan: [0.25, 0.5, 0.75]
    skirt_mu_scan: [0.05, 0.10, 0.20]
